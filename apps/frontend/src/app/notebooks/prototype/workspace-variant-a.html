<div class="va">
  <header class="va__header">
    <a
      class="va__icon-btn"
      routerLink="/"
      aria-label="Back to Notebooks"
      matTooltip="Back to Notebooks"
    >
      <proto-icon name="arrow-left" [size]="18" />
    </a>
    @if (editing()) {
      <input
        class="va__title-input proto-title-input"
        type="text"
        aria-label="Notebook title"
        [value]="titleDraft()"
        (input)="onTitleInput($event)"
        (keydown.enter)="commitTitle()"
        (keydown.escape)="cancelTitle()"
        (blur)="commitTitle()"
      />
    } @else {
      <button type="button" class="va__title" (click)="startEdit()" matTooltip="Rename">
        {{ title() }}
        <proto-icon name="rename" [size]="14" />
      </button>
    }
    <span class="va__spacer"></span>
    <a
      class="va__icon-btn"
      [routerLink]="['/notebooks', notebookId(), 'search']"
      aria-label="Search this Notebook"
      matTooltip="Search this Notebook"
    >
      <proto-icon name="search" [size]="18" />
    </a>
  </header>

  <div class="va__body" [class.va__body--collapsed]="collapsed()">
    <section class="va__docs" aria-label="Documents" [class.va__docs--drag]="dragOver()">
      @if (collapsed()) {
        <div class="va__rail">
          <button
            type="button"
            class="va__icon-btn"
            aria-label="Expand Documents"
            matTooltip="Expand Documents"
            (click)="collapsed.set(false)"
          >
            <proto-icon name="panel-left-expand" [size]="18" />
          </button>
          <span class="va__rail-icon" [matTooltip]="documentCount() + ' Documents'">
            <proto-icon name="document" [size]="18" />
          </span>
          <span class="va__rail-count">{{ documentCount() }}</span>
        </div>
      } @else {
        <div class="va__pane-head">
          <h2 class="va__pane-title">
            Documents <span class="va__count">{{ documentCount() }}</span>
          </h2>
          <span class="va__spacer"></span>
          <proto-add-documents-button [notebookId]="notebookId()" kind="icon" />
          <button
            type="button"
            class="va__icon-btn"
            aria-label="Collapse Documents"
            matTooltip="Collapse Documents"
            (click)="collapsed.set(true)"
          >
            <proto-icon name="panel-left-contract" [size]="18" />
          </button>
        </div>
        <label class="va__filter">
          <proto-icon name="filter" [size]="14" />
          <input
            type="search"
            placeholder="Filter by name"
            aria-label="Filter Documents"
            [value]="filter()"
            (input)="onFilterInput($event)"
          />
        </label>
        <div class="va__pane-body">
          <proto-document-list [notebookId]="notebookId()" [filter]="filter()" />
        </div>
        @if (dragOver()) {
          <div class="va__drop-hint">Drop files to upload them into this Notebook</div>
        }
      }
    </section>

    <section class="va__chat" aria-label="Chat">
      <div class="va__pane-head va__pane-head--chat">
        <proto-thread-menu [notebookId]="notebookId()" />
        <span class="va__spacer"></span>
        <span class="va__grounding"
          >Grounded in {{ readyCount() }} of {{ documentCount() }} Documents</span
        >
      </div>
      <div class="va__messages">
        <div class="va__messages-inner">
          <proto-message-list [notebookId]="notebookId()" />
        </div>
      </div>
      <div class="va__composer">
        <proto-composer [notebookId]="notebookId()" [threadId]="activeThread()?.id ?? null" />
      </div>
    </section>
  </div>
</div>
