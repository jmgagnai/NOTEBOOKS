<mat-card class="notebooks-page">
  <mat-card-header>
    <mat-card-title>Notebooks</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (store.loading()) {
      <mat-progress-spinner mode="indeterminate" diameter="32" />
    } @else if (store.error(); as error) {
      <p class="notebooks-page__error">{{ error }}</p>
    } @else if (store.notebooks().length === 0) {
      <p>No Notebooks yet.</p>
    } @else {
      <mat-list>
        @for (notebook of store.notebooks(); track notebook.id) {
          <mat-list-item>{{ notebook.title }}</mat-list-item>
        }
      </mat-list>
    }
  </mat-card-content>
</mat-card>
