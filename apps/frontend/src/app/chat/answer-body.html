@defer (on idle) {
  <app-markdown-view
    class="answer-body__markdown"
    [markdown]="markdown()"
    [markWords]="markWords()"
  />
} @placeholder {
  <!-- Until the renderer loads (NBK-52): the source text, its line breaks kept. -->
  <p class="answer-body__plain">
    @for (segment of segments(); track $index) {
      @if (segment.citation; as citation) {
        <a
          class="answer-body__marker"
          [attr.aria-label]="'Citation ' + citation.marker"
          [title]="title(citation)"
          [routerLink]="link(citation)"
          [queryParams]="params(citation)"
          >{{ citation.marker }}</a
        >
      } @else if (markWords().length) {
        <!-- The search result's words, as the rendered answer will mark them. -->
        <span><app-marked-text marker="mark" [segments]="runs(segment.text)" /></span>
      } @else {
        <span>{{ segment.text }}</span>
      }
    }
  </p>
}
