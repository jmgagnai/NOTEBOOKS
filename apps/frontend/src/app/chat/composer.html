@if (store.error(); as error) {
  <!--
    Above the box rather than inside the message list (spec 04, story 23):
    the 503 when the LLM is unavailable is about the ask, not the Thread,
    and it must not scroll away with the messages.
  -->
  <div class="composer__error" role="alert">
    <mat-icon class="composer__error-icon" svgIcon="warning" />
    <span class="composer__error-text">{{ error }}</span>
    <button
      mat-icon-button
      type="button"
      class="composer__error-dismiss"
      aria-label="Dismiss"
      matTooltip="Dismiss"
      (click)="store.dismissError()"
    >
      <mat-icon svgIcon="dismiss" />
    </button>
  </div>
}

<div class="composer" [class.composer--closed]="closed()" [class.composer--answering]="answering()">
  @if (answering()) {
    <!-- Along the top edge; the spinner below is what is announced. -->
    <mat-progress-bar class="composer__progress" mode="indeterminate" aria-hidden="true" />
  }
  <textarea
    #textarea
    class="composer__input"
    aria-label="Ask a question"
    placeholder="Ask a question about this Notebook…"
    rows="1"
    [disabled]="closed()"
    [value]="draft()"
    (input)="draft.set($any($event.target).value); fit()"
    (keydown.enter)="onEnter($event)"
  ></textarea>
  <div class="composer__bar">
    <span class="composer__hint">{{ hint() }}</span>
    @if (answering()) {
      <span class="composer__answering" role="status" aria-label="Answering">
        <mat-progress-spinner mode="indeterminate" diameter="20" aria-hidden="true" />
      </span>
    } @else {
      <button
        mat-icon-button
        type="button"
        class="composer__send"
        aria-label="Send"
        matTooltip="Send"
        [disabled]="!canSend()"
        (click)="send()"
      >
        <mat-icon svgIcon="send" />
      </button>
    }
  </div>
</div>
