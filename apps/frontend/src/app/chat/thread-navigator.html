<div class="thread-navigator">
  <!--
    The workspace card's header row (NBK-35), as spec 04 settles it: the
    title with its history icon and the one control that starts a Thread.
    The icon-only button carries both an aria-label and a tooltip, so the
    name is there for a screen reader and for a mouse (spec 01 "Icons").
  -->
  <div class="thread-navigator__head">
    <h2 class="thread-navigator__title">
      <mat-icon svgIcon="history" class="thread-navigator__title-icon" />
      Chat Threads
    </h2>
    <span class="thread-navigator__spacer"></span>
    <button
      mat-icon-button
      type="button"
      class="thread-navigator__new-thread"
      aria-label="New Chat Thread"
      matTooltip="New Chat Thread"
      [disabled]="store.creatingThread()"
      (click)="newThread()"
    >
      <mat-icon svgIcon="add" />
    </button>
  </div>

  <div class="thread-navigator__body">
    @if (store.threadsLoading()) {
      <mat-progress-spinner mode="indeterminate" diameter="24" />
    } @else if (store.threads().length === 0) {
      <p class="thread-navigator__empty">No Chat Threads yet.</p>
    } @else {
      <!--
        Every Thread in the Notebook, whoever started it (GLOSSARY.md,
        ADR-0001) — so each entry has to say whose it is, and none of them
        is hidden or disabled for not being yours. The open Thread's row is
        the current one, not a selected option: the rows are a navigator,
        not a listbox, which is what makes `aria-current` the right state.
      -->
      <ul class="thread-navigator__thread-list">
        @for (thread of store.threads(); track thread.id) {
          <li
            class="thread-navigator__thread"
            [class.thread-navigator__thread--mine]="isMine(thread)"
          >
            <button
              type="button"
              class="thread-navigator__thread-open"
              [class.thread-navigator__thread-open--active]="isOpen(thread)"
              [attr.aria-current]="isOpen(thread) ? 'true' : null"
              [attr.aria-label]="'Open ' + thread.title"
              (click)="openThread(thread)"
            >
              <span class="thread-navigator__thread-title">{{ thread.title }}</span>
              <span class="thread-navigator__thread-meta"
                >{{ thread.author.email }} · {{ thread.createdAt | shortDate }}</span
              >
            </button>
            @if (isMine(thread)) {
              <!--
                NBK-95: the author's own Threads only, Delete its one item;
                shown on hover and focus, like the Notebook rows' (spec 07
                story 24).
              -->
              <button
                mat-icon-button
                type="button"
                class="thread-navigator__thread-menu"
                [attr.aria-label]="'Actions for ' + thread.title"
                matTooltip="More actions"
                [matMenuTriggerFor]="threadMenu"
              >
                <mat-icon svgIcon="more-horizontal" />
              </button>
              <mat-menu #threadMenu="matMenu">
                <button
                  mat-menu-item
                  type="button"
                  [attr.aria-label]="'Delete ' + thread.title"
                  (click)="deleteThread(thread)"
                >
                  <mat-icon svgIcon="delete" />
                  <span>Delete</span>
                </button>
              </mat-menu>
            }
          </li>
        }
      </ul>
    }
  </div>
</div>
