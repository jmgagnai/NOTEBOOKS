@if (store.user(); as user) {
  <mat-toolbar class="app-shell__toolbar">
    <span class="app-shell__brand">RAG Notebook</span>
    <span class="app-shell__spacer"></span>
    <button
      type="button"
      class="app-shell__account"
      [matMenuTriggerFor]="accountMenu"
      [attr.aria-label]="'Account menu for ' + user.email"
    >
      <app-avatar [email]="user.email" />
    </button>
    <mat-menu #accountMenu="matMenu" xPosition="before">
      <button mat-menu-item disabled>{{ user.email }}</button>
      <button mat-menu-item class="app-shell__sign-out" (click)="signOut()">Sign out</button>
    </mat-menu>
  </mat-toolbar>
}

<router-outlet />
