@if (store.user(); as user) {
  <mat-toolbar class="app-shell__toolbar">
    <!-- NBK-59: the mark's alt names the link; the visible name is hidden
         from assistive tech so the app name is announced once, not twice. -->
    <a class="app-shell__brand" routerLink="/">
      <app-copycat-mark [size]="24" [label]="appName" />
      <span class="app-shell__name" aria-hidden="true">{{ appName }}</span>
    </a>
    <span class="app-shell__spacer"></span>
    <button
      type="button"
      class="app-shell__account"
      [matMenuTriggerFor]="accountMenu"
      [attr.aria-label]="'Account menu for ' + user.email"
    >
      <app-avatar [email]="user.email" />
    </button>
    <mat-menu #accountMenu="matMenu" xPosition="before">
      <button mat-menu-item disabled>{{ user.email }}</button>
      <button mat-menu-item class="app-shell__sign-out" (click)="signOut()">
        <mat-icon svgIcon="sign-out" />
        <span>Sign out</span>
      </button>
    </mat-menu>
  </mat-toolbar>
}

<router-outlet />
