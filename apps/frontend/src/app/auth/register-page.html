<div class="register-page">
  <p class="register-page__brand">{{ appName }}</p>
  <h1 class="register-page__title">Create account</h1>

  <form (submit)="submit($event)">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        [value]="email()"
        (input)="onEmailInput($event)"
        required
        autocomplete="email"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        [value]="password()"
        (input)="onPasswordInput($event)"
        required
        minlength="8"
        autocomplete="new-password"
      />
    </mat-form-field>

    @if (store.error(); as error) {
      <p class="register-page__error">{{ error }}</p>
    }

    <button
      mat-flat-button
      type="submit"
      class="register-page__submit"
      [disabled]="store.loading()"
    >
      @if (store.loading()) {
        <mat-progress-spinner mode="indeterminate" diameter="20" />
      } @else {
        Create account
      }
    </button>
  </form>

  <p class="register-page__switch">Already have an account? <a routerLink="/login">Sign in</a></p>
</div>
