<div class="login-page">
  <p class="login-page__brand">{{ appName }}</p>
  <h1 class="login-page__title">Sign in</h1>

  <form (submit)="submit($event)">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        [value]="email()"
        (input)="onEmailInput($event)"
        required
        autocomplete="email"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        [value]="password()"
        (input)="onPasswordInput($event)"
        required
        autocomplete="current-password"
      />
    </mat-form-field>

    @if (store.error(); as error) {
      <p class="login-page__error">{{ error }}</p>
    }

    <button mat-flat-button type="submit" class="login-page__submit" [disabled]="store.loading()">
      @if (store.loading()) {
        <mat-progress-spinner mode="indeterminate" diameter="20" />
      } @else {
        Sign in
      }
    </button>
  </form>

  <p class="login-page__switch">No account? <a routerLink="/register">Create one</a></p>
</div>
