services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_notebook
      POSTGRES_PASSWORD: rag_notebook
      POSTGRES_DB: rag_notebook
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_notebook -d rag_notebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The official `minio/minio` image now requires a Docker Hub login to
    # pull (MinIO gated it behind auth in 2025). bitnamilegacy/minio is the
    # free-tier mirror Bitnami kept publishing after its own policy change,
    # and wraps the same MinIO server.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: rag_notebook
      MINIO_ROOT_PASSWORD: rag_notebook_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
